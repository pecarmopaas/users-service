name: Build and Deploy Users Service

on:
  push:
    branches:
      - dev
      - uat
      - prd

permissions:
  contents: read

env:
  ENV: ${{ github.ref_name }}
  APP_NAME: ${{ github.event.repository.name }}
  NAMESPACE: ${{ github.event.repository.name }}-ns
  ACR_NAME: acrneu${{ github.ref_name }}all
  ACR_REGISTRY: acrneu${{ github.ref_name }}all.azurecr.io
  AKS_NAME: aks-neu-${{ github.ref_name }}
  RESOURCE_GROUP: rg-neu-${{ github.ref_name }}
  KEY_VAULT_NAME: kv-neu-${{ github.ref_name }}-all
  ACR_IMAGE_TAG: ${{ github.ref_name }}-${{ github.run_number }}
  DEPLOYMENT_YML_PATH: envs/${{ github.ref_name }}/deployment.yml

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }

      - name: Get AKS credentials
        run: az aks get-credentials --name ${{ env.AKS_NAME }} --resource-group ${{ env.RESOURCE_GROUP }}

      - name: Create namespace if it doesn’t exist
        run: |
          if ! kubectl get namespace ${{ env.NAMESPACE }} &> /dev/null; then
            echo "Namespace ${{ env.NAMESPACE }} does not exist, creating it."
            kubectl create namespace ${{ env.NAMESPACE }}
          fi

      - name: Log in to Azure Container Registry
        run: |
          ACR_USERNAME=$(az acr credential show --name ${{ env.ACR_NAME }} --query username --output tsv)
          ACR_PASSWORD=$(az acr credential show --name ${{ env.ACR_NAME }} --query passwords[0].value --output tsv)
          echo "$ACR_PASSWORD" | docker login ${{ env.ACR_REGISTRY }} -u "$ACR_USERNAME" --password-stdin

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.APP_NAME }}:${{ env.ENV }}
            ${{ env.ACR_REGISTRY }}/${{ env.APP_NAME }}:${{ env.ACR_IMAGE_TAG }}
          push: true

      - name: Retrieve identity from Azure Key Vault
        run: |
          ID=$(az keyvault secret show --vault-name ${{ env.KEY_VAULT_NAME }} --name aks-identity-id --query value -o tsv)
          sed -i "s|<identity_id>|$ID|g" ${{ env.DEPLOYMENT_YML_PATH }}

      - name: Deploy to AKS
        run: kubectl apply -f ${{ env.DEPLOYMENT_YML_PATH }}

      - name: Restart deployment to ensure new image is used
        run: kubectl rollout restart deployment/${{ env.APP_NAME }} -n ${{ env.NAMESPACE }}
